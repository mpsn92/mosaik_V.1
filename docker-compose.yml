version: "3.8"

services:
  mosaik-backend:
    build: .
    container_name: mosaik_backend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/mosaik
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mosaik_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
